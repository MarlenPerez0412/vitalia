<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Preparando sesion de captura</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const user = params.get('user');
      const target = params.get('to') || '/login';
      if (user) {
        localStorage.setItem('vitalia.mock-user', user);
      } else {
        localStorage.removeItem('vitalia.mock-user');
      }
      window.location.replace(target.startsWith('/') ? target : '/login');
    </script>
  </body>
</html>
